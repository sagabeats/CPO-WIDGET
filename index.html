<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CPO Status</title>

  <style>
    :root {
      --background: #191919;
      --text: #f1f1ef;
      --muted: #9b9a97;
      --accent: #704526;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--background);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget {
      width: min(100%, 420px);

      padding: 18px 22px;

      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;

      gap: 24px;
    }

    .left {
      min-width: 0;
    }

    .time {
      font-size: 46px;
      font-weight: 500;
      line-height: 0.9;

      letter-spacing: -2.5px;

      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 13px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.15em;

      white-space: nowrap;
    }

    .right {
      min-width: 92px;

      padding-left: 22px;

      border-left: 1px solid var(--accent);

      text-align: right;
    }

    .count {
      font-size: 38px;
      font-weight: 500;
      line-height: 0.9;

      letter-spacing: -1px;

      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 13px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.16em;

      white-space: nowrap;
    }

    @media (max-width: 360px) {
      .widget {
        padding: 16px;
        gap: 15px;
      }

      .time {
        font-size: 38px;
      }

      .count {
        font-size: 32px;
      }

      .right {
        min-width: 76px;
        padding-left: 15px;
      }

      .date {
        font-size: 8px;
        letter-spacing: 0.1em;
      }

      .label {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="widget">

    <section class="left">

      <div
        class="time"
        id="time"
      >
        00:00
      </div>

      <div
        class="date"
        id="date"
      >
        SAT · SEP 12
      </div>

    </section>


    <section class="right">

      <div
        class="count"
        id="beatCount"
      >
        8
      </div>

      <div class="label">
        BEAT COUNT
      </div>

    </section>

  </main>


  <script>

    const TIME_ZONE = "Asia/Jakarta";


    // ==============================
    // BEAT COUNT
    // ==============================

    const params =
      new URLSearchParams(window.location.search);

    const beatParam =
      Number(params.get("beats"));

    const beatCount =
      Number.isFinite(beatParam) &&
      beatParam >= 0
        ? Math.floor(beatParam)
        : 8;

    document
      .getElementById("beatCount")
      .textContent = beatCount;



    // ==============================
    // CLOCK
    // ==============================

    function updateClock() {

      const now = new Date();


      const time =
        new Intl.DateTimeFormat(
          "en-GB",
          {
            timeZone: TIME_ZONE,
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }
        ).format(now);


      const weekday =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            weekday: "short"
          }
        )
        .format(now)
        .toUpperCase();


      const month =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            month: "short"
          }
        )
        .format(now)
        .toUpperCase();


      const day =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            day: "2-digit"
          }
        ).format(now);


      document
        .getElementById("time")
        .textContent = time;


      document
        .getElementById("date")
        .textContent =
          `${weekday} · ${month} ${day}`;
    }


    updateClock();

    setInterval(updateClock, 1000);

  </script>

</body>
</html>
