<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CPO Widget</title>

  <style>
    :root {
      --bg: #191919;

      --panel-top: #262422;
      --panel-bottom: #202020;

      --panel-border: #3b3936;

      --text: #f1f1ef;
      --muted: #b5aaa0;

      --accent: #704526;

      --panel-width: 112px;
      --panel-height: 132px;

      --number-size: 68px;

      --meta-size: 10px;
      --meta-spacing: 0.18em;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    /* ========================================
       OUTER WIDGET
    ======================================== */

    .widget {
      width: 100%;
      max-width: 560px;

      /*
        Deliberate top offset:
        aligns visual content with the brown
        QUICK NAVIGATOR header beside it.
      */
      padding: 20px 18px 16px;

      display: flex;
      justify-content: center;
    }

    /* ========================================
       FIXED GRID

       [ HOUR ][ MINUTE ]   |   [ BEAT ]
       [      DATE       ]       [ LABEL]
    ======================================== */

    .widget-grid {
      display: grid;

      grid-template-columns:
        var(--panel-width)
        var(--panel-width)
        3px
        var(--panel-width);

      grid-template-rows:
        var(--panel-height)
        20px;

      column-gap: 14px;
      row-gap: 12px;

      align-items: center;
      justify-items: center;
    }

    /* ========================================
       SHARED PANEL
    ======================================== */

    .panel {
      position: relative;

      width: var(--panel-width);
      height: var(--panel-height);

      border: 1px solid var(--panel-border);
      border-radius: 10px;

      background:
        linear-gradient(
          180deg,
          var(--panel-top) 0%,
          #242321 49%,
          var(--panel-bottom) 50%,
          #202020 100%
        );

      overflow: hidden;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.025),
        0 6px 18px rgba(0,0,0,0.10);
    }

    /* flip-clock horizontal division */

    .clock-panel::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      top: 50%;

      height: 1px;

      background: rgba(255,255,255,0.08);

      pointer-events: none;
    }

    /* ========================================
       CLOCK PANELS
    ======================================== */

    .clock-panel {
      display: flex;
      flex-direction: column;

      justify-content: flex-end;
      align-items: flex-start;

      padding: 15px 14px 14px;
    }

    .primary-number {
      position: relative;
      z-index: 1;

      margin: 0;

      font-size: var(--number-size);
      line-height: 0.86;

      font-weight: 700;

      letter-spacing: -4px;

      color: var(--text);

      font-variant-numeric: tabular-nums;
    }

    .clock-label {
      position: relative;
      z-index: 1;

      margin-top: 13px;

      font-size: 10px;
      line-height: 1;

      font-weight: 700;

      letter-spacing: 0.14em;

      color: var(--muted);

      text-transform: uppercase;
    }

    /* ========================================
       DIVIDER
    ======================================== */

    .divider {
      grid-column: 3;
      grid-row: 1;

      width: 3px;
      height: 92px;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(112,69,38,0.15) 0%,
          #704526 20%,
          #8a5731 50%,
          #704526 80%,
          rgba(112,69,38,0.15) 100%
        );

      align-self: center;
    }

    /* ========================================
       BEAT PANEL
    ======================================== */

    .beat-panel {
      grid-column: 4;
      grid-row: 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .beat-panel .primary-number {
      /*
        EXACT SAME SIZE AS CLOCK NUMBERS
      */
      font-size: var(--number-size);

      letter-spacing: -3px;

      transform: translateY(-1px);
    }

    /* ========================================
       SHARED METADATA

       DATE and BEAT COUNT are intentionally
       identical in typography.
    ======================================== */

    .meta {
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-size: var(--meta-size);
      line-height: 1;

      font-weight: 600;

      letter-spacing: var(--meta-spacing);

      text-transform: uppercase;

      white-space: nowrap;
    }

    .date {
      grid-column: 1 / 3;
      grid-row: 2;
    }

    .beat-label {
      grid-column: 4;
      grid-row: 2;
    }

    /* ========================================
       SMALLER EMBEDS
    ======================================== */

    @media (max-width: 440px) {
      :root {
        --panel-width: 88px;
        --panel-height: 108px;

        --number-size: 54px;

        --meta-size: 8px;
        --meta-spacing: 0.14em;
      }

      .widget {
        padding:
          18px
          6px
          12px;
      }

      .widget-grid {
        grid-template-columns:
          var(--panel-width)
          var(--panel-width)
          3px
          var(--panel-width);

        grid-template-rows:
          var(--panel-height)
          18px;

        column-gap: 9px;
        row-gap: 9px;
      }

      .clock-panel {
        padding:
          12px
          10px
          11px;
      }

      .clock-label {
        margin-top: 10px;

        font-size: 8px;
      }

      .divider {
        height: 76px;
      }

      .meta {
        height: 18px;
      }
    }
  </style>
</head>


<body>

  <main class="widget">

    <section class="widget-grid">

      <!-- ====================================
           HOUR
      ===================================== -->

      <div
        class="panel clock-panel"
        style="grid-column: 1; grid-row: 1;"
      >

        <div
          class="primary-number"
          id="hour"
        >
          02
        </div>

        <div
          class="clock-label"
          id="ampm"
        >
          AM
        </div>

      </div>


      <!-- ====================================
           MINUTE
      ===================================== -->

      <div
        class="panel clock-panel"
        style="grid-column: 2; grid-row: 1;"
      >

        <div
          class="primary-number"
          id="minute"
        >
          05
        </div>

        <div
          class="clock-label"
          id="weekday"
        >
          SAT
        </div>

      </div>


      <!-- ====================================
           DIVIDER
      ===================================== -->

      <div class="divider"></div>


      <!-- ====================================
           BEAT COUNT NUMBER
      ===================================== -->

      <div class="panel beat-panel">

        <div
          class="primary-number"
          id="beatCount"
        >
          8
        </div>

      </div>


      <!-- ====================================
           DATE
      ===================================== -->

      <div
        class="meta date"
        id="date"
      >
        SEP 12, 2026
      </div>


      <!-- ====================================
           BEAT COUNT LABEL
      ===================================== -->

      <div class="meta beat-label">
        BEAT COUNT
      </div>

    </section>

  </main>


  <script>
    const TIME_ZONE = "Asia/Jakarta";


    /* ========================================
       BEAT COUNT
    ======================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedBeatCount =
      Number(
        params.get("beats")
      );


    const beatCount =
      Number.isFinite(requestedBeatCount) &&
      requestedBeatCount >= 0

        ? Math.floor(requestedBeatCount)

        : 8;


    document
      .getElementById("beatCount")
      .textContent =
      beatCount;



    /* ========================================
       CLOCK
    ======================================== */

    function updateClock() {

      const now =
        new Date();


      const timeParts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,

            hour: "2-digit",
            minute: "2-digit",

            hour12: true
          }
        )
        .formatToParts(now);


      const getTimePart =
        (type) => {

          const part =
            timeParts.find(
              item =>
                item.type === type
            );

          return part
            ? part.value
            : "";
        };


      /* HOUR */

      document
        .getElementById("hour")
        .textContent =
        getTimePart("hour");


      /* MINUTE */

      document
        .getElementById("minute")
        .textContent =
        getTimePart("minute");


      /* AM / PM */

      document
        .getElementById("ampm")
        .textContent =
        getTimePart("dayPeriod")
          .toUpperCase();


      /* WEEKDAY */

      const weekday =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            weekday: "short"
          }
        )
        .format(now)
        .toUpperCase();


      document
        .getElementById("weekday")
        .textContent =
        weekday;


      /* MONTH */

      const month =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            month: "short"
          }
        )
        .format(now)
        .toUpperCase();


      /* DAY */

      const day =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            day: "2-digit"
          }
        )
        .format(now);


      /* YEAR */

      const year =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            year: "numeric"
          }
        )
        .format(now);


      /* DATE */

      document
        .getElementById("date")
        .textContent =
        `${month} ${day}, ${year}`;
    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );
  </script>

</body>

</html>
