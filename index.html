<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CPO Widget</title>

  <style>
    :root {
      --bg: #191919;

      --panel: #222222;
      --panel-border: #383838;

      --text: #f1f1ef;
      --muted: #b0a69d;

      --accent: #704526;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==============================
       MAIN WIDGET
    ============================== */

    .widget {
      width: 100%;
      max-width: 560px;

      padding: 18px 22px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 34px;
    }

    /* ==============================
       CLOCK
    ============================== */

    .clock-area {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;
    }

    .clock {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .clock-panel {
      position: relative;

      width: 112px;
      height: 132px;

      padding: 15px;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      background: var(--panel);

      border: 1px solid var(--panel-border);
      border-radius: 11px;
    }

    /* horizontal split line */

    .clock-panel::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 0;
      right: 0;

      height: 1px;

      background: rgba(255, 255, 255, 0.07);

      pointer-events: none;
    }

    .number {
      position: relative;
      z-index: 1;

      font-size: 70px;
      line-height: 0.88;

      font-weight: 700;

      letter-spacing: -4px;

      font-variant-numeric: tabular-nums;
    }

    .panel-label {
      position: relative;
      z-index: 1;

      margin-top: 11px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .date {
      color: var(--muted);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.20em;

      text-transform: uppercase;

      white-space: nowrap;
    }

    /* ==============================
       BEAT COUNT
    ============================== */

    .beat-section {
      display: flex;
      align-items: center;

      gap: 28px;
    }

    .divider {
      width: 1px;
      height: 108px;

      flex-shrink: 0;

      background: var(--accent);
    }

    .beat {
      min-width: 100px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .beat-number {
      font-size: 58px;
      line-height: 0.9;

      font-weight: 600;

      letter-spacing: -2px;

      font-variant-numeric: tabular-nums;
    }

    .beat-label {
      margin-top: 14px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.20em;

      text-align: center;

      white-space: nowrap;

      text-transform: uppercase;
    }

    /* ==============================
       SMALL NOTION EMBEDS
    ============================== */

    @media (max-width: 420px) {
      .widget {
        gap: 17px;

        padding: 12px 8px;
      }

      .clock-area {
        gap: 9px;
      }

      .clock {
        gap: 8px;
      }

      .clock-panel {
        width: 82px;
        height: 100px;

        padding: 10px;

        border-radius: 9px;
      }

      .number {
        font-size: 50px;

        letter-spacing: -3px;
      }

      .panel-label {
        margin-top: 8px;

        font-size: 8px;
      }

      .date {
        font-size: 8px;

        letter-spacing: 0.15em;
      }

      .beat-section {
        gap: 17px;
      }

      .divider {
        height: 82px;
      }

      .beat {
        min-width: 70px;
      }

      .beat-number {
        font-size: 44px;
      }

      .beat-label {
        margin-top: 11px;

        font-size: 7px;
      }
    }
  </style>
</head>


<body>

  <main class="widget">

    <!-- CLOCK -->

    <section class="clock-area">

      <div class="clock">

        <!-- HOUR -->

        <div class="clock-panel">

          <div
            class="number"
            id="hour"
          >
            01
          </div>

          <div
            class="panel-label"
            id="ampm"
          >
            AM
          </div>

        </div>


        <!-- MINUTE -->

        <div class="clock-panel">

          <div
            class="number"
            id="minute"
          >
            45
          </div>

          <div
            class="panel-label"
            id="weekday"
          >
            SAT
          </div>

        </div>

      </div>


      <!-- DATE -->

      <div
        class="date"
        id="date"
      >
        SEP 12, 2026
      </div>

    </section>


    <!-- BEAT COUNT -->

    <section class="beat-section">

      <div class="divider"></div>


      <div class="beat">

        <div
          class="beat-number"
          id="beatCount"
        >
          8
        </div>

        <div class="beat-label">
          BEAT COUNT
        </div>

      </div>

    </section>

  </main>



  <script>
    const TIME_ZONE = "Asia/Jakarta";


    /* ==============================
       BEAT COUNT
    ============================== */

    const params =
      new URLSearchParams(window.location.search);

    const value =
      Number(params.get("beats"));

    const beatCount =
      Number.isFinite(value) && value >= 0
        ? Math.floor(value)
        : 8;

    document
      .getElementById("beatCount")
      .textContent = beatCount;



    /* ==============================
       CLOCK
    ============================== */

    function updateClock() {
      const now = new Date();


      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,

            hour: "2-digit",
            minute: "2-digit",

            hour12: true
          }
        )
        .formatToParts(now);


      const getPart = type =>
        parts.find(
          part => part.type === type
        )?.value;


      /* HOUR */

      document
        .getElementById("hour")
        .textContent =
        getPart("hour");


      /* MINUTE */

      document
        .getElementById("minute")
        .textContent =
        getPart("minute");


      /* AM / PM */

      document
        .getElementById("ampm")
        .textContent =
        getPart("dayPeriod");


      /* WEEKDAY */

      const weekday =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            weekday: "short"
          }
        )
        .format(now)
        .toUpperCase();


      document
        .getElementById("weekday")
        .textContent =
        weekday;


      /* MONTH */

      const month =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            month: "short"
          }
        )
        .format(now)
        .toUpperCase();


      /* DAY */

      const day =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            day: "2-digit"
          }
        )
        .format(now);


      /* YEAR */

      const year =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            year: "numeric"
          }
        )
        .format(now);


      /* DATE */

      document
        .getElementById("date")
        .textContent =
        `${month} ${day}, ${year}`;
    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );
  </script>

</body>

</html>
