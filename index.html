<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CPO Widget</title>

  <style>
    :root {
      --bg: #191919;
      --panel: #242424;
      --panel-border: #343434;

      --text: #f1f1ef;
      --muted: #9f9a94;

      --accent: #704526;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget {
      width: 100%;
      max-width: 500px;

      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 26px;
    }

    /* CLOCK */

    .clock-area {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 11px;
    }

    .clock {
      display: flex;
      gap: 10px;
    }

    .clock-panel {
      position: relative;

      width: 92px;
      height: 112px;

      background: var(--panel);

      border: 1px solid var(--panel-border);
      border-radius: 10px;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding: 13px;
    }

    .clock-panel::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      top: 50%;

      height: 1px;

      background: rgba(255,255,255,0.07);
    }

    .number {
      font-size: 58px;
      line-height: 0.9;

      font-weight: 700;
      letter-spacing: -3px;

      font-variant-numeric: tabular-nums;
    }

    .panel-label {
      margin-top: 10px;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 0.15em;

      color: var(--muted);
    }

    .date {
      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.18em;

      color: var(--muted);

      white-space: nowrap;
    }

    /* BEAT COUNT */

    .beat-section {
      display: flex;
      align-items: center;

      gap: 25px;
    }

    .divider {
      width: 1px;
      height: 91px;

      background: var(--accent);
    }

    .beat {
      min-width: 78px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .beat-number {
      font-size: 50px;
      line-height: 0.9;

      font-weight: 600;

      letter-spacing: -2px;

      font-variant-numeric: tabular-nums;
    }

    .beat-label {
      margin-top: 14px;

      color: var(--muted);

      font-size: 8px;
      font-weight: 600;

      letter-spacing: 0.19em;

      white-space: nowrap;
    }

    /* SMALL NOTION EMBEDS */

    @media (max-width: 420px) {
      .widget {
        gap: 16px;
        padding: 12px;
      }

      .clock-panel {
        width: 76px;
        height: 96px;

        padding: 10px;
      }

      .number {
        font-size: 47px;
      }

      .beat-section {
        gap: 16px;
      }

      .divider {
        height: 78px;
      }

      .beat-number {
        font-size: 41px;
      }
    }
  </style>
</head>


<body>

  <main class="widget">

    <section class="clock-area">

      <div class="clock">

        <div class="clock-panel">
          <div class="number" id="hour">
            01
          </div>

          <div class="panel-label" id="ampm">
            AM
          </div>
        </div>


        <div class="clock-panel">
          <div class="number" id="minute">
            33
          </div>

          <div class="panel-label" id="weekday">
            SAT
          </div>
        </div>

      </div>


      <div class="date" id="date">
        SEP 12, 2026
      </div>

    </section>


    <section class="beat-section">

      <div class="divider"></div>


      <div class="beat">

        <div class="beat-number" id="beatCount">
          8
        </div>

        <div class="beat-label">
          BEAT COUNT
        </div>

      </div>

    </section>

  </main>



  <script>
    const TIME_ZONE = "Asia/Jakarta";


    /* BEAT COUNT */

    const params =
      new URLSearchParams(window.location.search);

    const value =
      Number(params.get("beats"));

    const beatCount =
      Number.isFinite(value) && value >= 0
        ? Math.floor(value)
        : 8;

    document
      .getElementById("beatCount")
      .textContent = beatCount;



    /* CLOCK */

    function updateClock() {

      const now = new Date();


      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,

            hour: "2-digit",
            minute: "2-digit",

            hour12: true
          }
        )
        .formatToParts(now);


      const getPart = type =>
        parts.find(
          part => part.type === type
        )?.value;


      document
        .getElementById("hour")
        .textContent =
        getPart("hour");


      document
        .getElementById("minute")
        .textContent =
        getPart("minute");


      document
        .getElementById("ampm")
        .textContent =
        getPart("dayPeriod");


      const weekday =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            weekday: "short"
          }
        )
        .format(now)
        .toUpperCase();


      document
        .getElementById("weekday")
        .textContent =
        weekday;


      const month =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            month: "short"
          }
        )
        .format(now)
        .toUpperCase();


      const day =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            day: "2-digit"
          }
        )
        .format(now);


      const year =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            year: "numeric"
          }
        )
        .format(now);


      document
        .getElementById("date")
        .textContent =
        `${month} ${day}, ${year}`;
    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );
  </script>

</body>
</html>
