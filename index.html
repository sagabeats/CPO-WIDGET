<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CPO Widget</title>

  <style>
    :root {
      --text: #f1f1ef;
      --muted: #9b9a97;
      --accent: #6b4328;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      background: transparent;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget {
      width: 100%;
      padding: 10px 14px;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 24px;
    }

    .time {
      font-size: clamp(36px, 11vw, 52px);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -2px;

      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 9px;

      font-size: clamp(9px, 2.5vw, 11px);
      font-weight: 600;

      letter-spacing: 0.12em;

      color: var(--muted);

      white-space: nowrap;
    }

    .right {
      min-width: 72px;

      padding-left: 20px;

      border-left: 1px solid var(--accent);

      text-align: right;
    }

    .count {
      font-size: clamp(32px, 10vw, 46px);
      font-weight: 500;
      line-height: 0.95;

      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 9px;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.14em;

      color: var(--muted);

      white-space: nowrap;
    }

    @media (max-width: 320px) {
      .widget {
        gap: 14px;
        padding-left: 8px;
        padding-right: 8px;
      }

      .right {
        padding-left: 14px;
      }

      .date {
        letter-spacing: 0.07em;
      }
    }
  </style>
</head>

<body>

  <main class="widget">

    <section class="left">
      <div class="time" id="time">00:00</div>

      <div class="date" id="date">
        SATURDAY · SEPTEMBER 12, 2026
      </div>
    </section>

    <section class="right">
      <div class="count" id="beatCount">8</div>

      <div class="label">
        BEAT COUNT
      </div>
    </section>

  </main>

  <script>
    const TIME_ZONE = "Asia/Jakarta";

    // =========================
    // BEAT COUNT
    // =========================

    const params = new URLSearchParams(window.location.search);
    const beatParam = Number(params.get("beats"));

    const beatCount =
      Number.isFinite(beatParam) && beatParam >= 0
        ? Math.floor(beatParam)
        : 8;

    document.getElementById("beatCount").textContent = beatCount;


    // =========================
    // CLOCK + DATE
    // =========================

    function updateClock() {
      const now = new Date();

      const time = new Intl.DateTimeFormat("en-GB", {
        timeZone: TIME_ZONE,
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(now);

      const weekday = new Intl.DateTimeFormat("en-US", {
        timeZone: TIME_ZONE,
        weekday: "long"
      })
        .format(now)
        .toUpperCase();

      const calendarDate = new Intl.DateTimeFormat("en-US", {
        timeZone: TIME_ZONE,
        month: "long",
        day: "numeric",
        year: "numeric"
      })
        .format(now)
        .toUpperCase();

      document.getElementById("time").textContent = time;

      document.getElementById("date").textContent =
        `${weekday} · ${calendarDate}`;
    }

    updateClock();

    setInterval(updateClock, 1000);
  </script>

</body>
</html>
